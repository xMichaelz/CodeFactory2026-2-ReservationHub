spring.application.name=reservahub

# Datasource (override with env vars)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/reservahub}
spring.datasource.username=${DB_USERNAME:reservahub}
spring.datasource.password=${DB_PASSWORD:reservahub}

# JPA — schema owned by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${SERVER_PORT:8080}

# Actuator — expose only health by default
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT
app.security.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-256-bits-long!!}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Bloqueo por intentos fallidos de login (#202)
app.security.lockout.max-attempts=${LOCKOUT_MAX_ATTEMPTS:5}
app.security.lockout.duration-minutes=${LOCKOUT_DURATION_MINUTES:15}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
