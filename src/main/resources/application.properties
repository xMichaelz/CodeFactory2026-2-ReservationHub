spring.application.name=reservahub

# Datasource: sin credenciales por defecto (V-01); DB_USERNAME, DB_PASSWORD y DB_URL son obligatorias
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Migraciones con el dueño de la BD; la app corre con un usuario sin DDL (V-07/V-10)
spring.flyway.user=${DB_OWNER_USERNAME}
spring.flyway.password=${DB_OWNER_PASSWORD}

# JPA — schema owned by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${SERVER_PORT:8080}

# IP real detrás de Nginx (V-03): Tomcat cree el X-Forwarded-For solo si la petición llega de un proxy
# interno (loopback y las redes privadas de Docker 172.16.0.0/12 y 192.168.0.0/16). El mismo regex lo usa
# el filtro de límite de peticiones; desde cualquier otra IP la cabecera se ignora.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${app.rate-limit.trusted-proxies}

# Actuator — expose only health by default
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT: JWT_SECRET obligatorio, >= 32 bytes (V-01); JwtService rechaza ausente o corto
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# Bloqueo por intentos fallidos de login (#202)
app.security.lockout.max-attempts=${LOCKOUT_MAX_ATTEMPTS:5}
app.security.lockout.duration-minutes=${LOCKOUT_DURATION_MINUTES:15}

# Límite de peticiones (V-03). Al pasarse: 429 RATE_LIMITED con Retry-After. Tabla en docs/api/errors.md.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Por IP del cliente
app.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:10}
app.rate-limit.registration-per-hour=${RATE_LIMIT_REGISTRATION_PER_HOUR:20}
app.rate-limit.provider-registration-per-hour=${RATE_LIMIT_PROVIDER_REGISTRATION_PER_HOUR:3}
# Por usuario autenticado (disponibilidad, catálogo y reservations/mine comparten cupo)
app.rate-limit.authenticated-per-minute=${RATE_LIMIT_AUTHENTICATED_PER_MINUTE:60}
app.rate-limit.lookup-per-minute=${RATE_LIMIT_LOOKUP_PER_MINUTE:10}
# Proxies de confianza (regex): loopback, 172.16.0.0/12 y 192.168.0.0/16
app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:127\\.\\d+\\.\\d+\\.\\d+|0:0:0:0:0:0:0:1|::1|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d+\\.\\d+|192\\.168\\.\\d+\\.\\d+}

# Zona del negocio: fechas y horas de reservas y horarios (EP-03)
app.business.zone=${BUSINESS_ZONE:America/Bogota}

# CORS: orígenes del frontend permitidos (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenAPI: apagado salvo SWAGGER_ENABLED=true (V-06)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Auditoría en JSON (V-12): una línea por evento con action, actor, ip, outcome, traceId
logging.structured.format.console=${LOG_FORMAT:logstash}
