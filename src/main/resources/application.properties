spring.application.name=reservahub

# Datasource: sin credenciales por defecto (V-01); DB_USERNAME, DB_PASSWORD y DB_URL son obligatorias
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA — schema owned by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${SERVER_PORT:8080}

# Actuator — expose only health by default
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT: JWT_SECRET obligatorio, >= 32 bytes (V-01); JwtService rechaza ausente o corto
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# Bloqueo por intentos fallidos de login (#202)
app.security.lockout.max-attempts=${LOCKOUT_MAX_ATTEMPTS:5}
app.security.lockout.duration-minutes=${LOCKOUT_DURATION_MINUTES:15}

# Zona del negocio: fechas y horas de reservas y horarios (EP-03)
app.business.zone=${BUSINESS_ZONE:America/Bogota}

# CORS: orígenes del frontend permitidos (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenAPI: apagado salvo SWAGGER_ENABLED=true (V-06)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
