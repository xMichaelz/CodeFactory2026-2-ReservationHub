spring.application.name=reservahub-test
app.security.jwt.secret=test-secret-key-with-at-least-thirty-two-characters!!
app.security.jwt.expiration-ms=3600000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health

# Límite de peticiones (V-03 · O4): valores altos para no romper el resto de la suite.
# RateLimitCoverageTest los baja a 2 con @TestPropertySource.
app.rate-limit.enabled=true
app.rate-limit.login-per-minute=10000
app.rate-limit.registration-per-hour=10000
app.rate-limit.provider-registration-per-hour=10000
app.rate-limit.authenticated-per-minute=10000
app.rate-limit.lookup-per-minute=10000

# Swagger apagado por defecto también en tests (V-06); SwaggerExposureTest lo enciende con @TestPropertySource.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Auditoría en JSON también en tests
logging.structured.format.console=logstash
