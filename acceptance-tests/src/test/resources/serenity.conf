serenity {
    take.screenshots = FOR_FAILURES
    test.root = co.edu.udea.calidad.reservahub
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
    # Escritorio: el menú lateral y los datos del usuario se ocultan por CSS en pantallas angostas
    browser.width = 1440
    browser.height = 900
}

# Sin ventana: ./gradlew test -Dheadless.mode=true
#headless.mode = true

# Frontend bajo prueba (por defecto el de Docker Compose). Se cambia con -Dreservahub.url=...
reservahub.url = "http://localhost:3001"

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
}

chrome {
    preferences {
        credentials_enable_service = false
        profile.password_manager_enabled = false
        profile.password_manager_leak_detection = false
    }
}

webdriver.timeouts.implicitlywait = 5000
serenity.restart.browser.for.each = scenario

chrome.switches = """
--window-size=1440,900;
--test-type;
--ignore-certificate-errors;
--disable-popup-blocking;
--disable-default-apps;
--disable-extensions-file-access-check;
--incognito;
--disable-infobars;
--disable-features=PasswordLeakDetection;
--disable-gpu;
--lang=es-CO;
--remote-allow-origins=*
"""
