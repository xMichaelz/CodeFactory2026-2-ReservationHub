# Plantilla procesada por envsubst al arrancar (imagen oficial de nginx): ${API_UPSTREAM}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver de Docker: permite arrancar aunque la API aún no exista y re-resolver su IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://${API_UPSTREAM};

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # API, documentación y salud del backend: mismo origen para el navegador (sin CORS).
    location ~ ^/(api|v3/api-docs|swagger-ui|actuator)(/|$)|^/swagger-ui\.html$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # Recursos con hash: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html para que la resuelva React Router
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
