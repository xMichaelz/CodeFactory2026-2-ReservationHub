services:
  db:
    image: postgres:16-alpine
    container_name: reservahub-db
    environment:
      POSTGRES_DB: reservahub
      POSTGRES_USER: reservahub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en .env}
    ports:
      # Host 5433 avoids clashing with a local PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - reservahub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservahub -d reservahub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: reservahub-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/reservahub
      DB_USERNAME: reservahub
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en .env (openssl rand -base64 48)}
      JWT_EXPIRATION_MS: "${JWT_EXPIRATION_MS:-1800000}"
      SWAGGER_ENABLED: "${SWAGGER_ENABLED:-false}"
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  reservahub_pgdata:
