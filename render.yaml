# ReservaHub on Render: Docker web service (Java 25) + PostgreSQL 16.
# Flyway applies migrations on startup. JWT_SECRET is generated by Render.

databases:
  - name: reservahub-db
    databaseName: reservahub
    user: reservahub
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: reservahub-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: reservahub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: reservahub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: reservahub-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: reservahub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: reservahub-db
          property: password
      - key: DB_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      - key: LOCKOUT_MAX_ATTEMPTS
        value: "5"
      - key: LOCKOUT_DURATION_MINUTES
        value: "15"
      - key: BUSINESS_ZONE
        value: America/Bogota
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: TOMCAT_MAX_THREADS
        value: "20"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx160m -Xms96m -XX:MaxMetaspaceSize=220m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -Xss256k"
